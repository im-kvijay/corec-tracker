name: Analyze & Report

on:
  schedule:
    # Run daily at 6am ET (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate analysis report
        # Node, not npm run: npm's banner would otherwise end up in REPORT.md
        run: node src/report.js > REPORT.md

      - name: Show report
        run: cat REPORT.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: REPORT.md
          retention-days: 30
